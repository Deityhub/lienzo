# Automatically label PRs based on changed files

'documentation':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**/*'

'dependencies':
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'yarn.lock'

'tests':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.spec.ts'
          - '**/*.test.ts'
          - 'e2e/**/*'
          - 'tests/**/*'

'ci/cd':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'

'components':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/lib/components/**/*'
          - 'src/routes/**/components/**/*'

'store':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/lib/stores/**/*'

'types':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/lib/types/**/*'

'styles':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.css'
          - 'tailwind.config.*'

'config':
  - changed-files:
      - any-glob-to-any-file:
          - '*.config.*'
          - '.eslintrc.*'
          - '.prettierrc.*'
          - 'tsconfig.json'
