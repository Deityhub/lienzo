name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn check

  unit-tests:
    name: Unit Tests
    # Playwright does not support ubuntu-latest (26.04) yet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:unit:run

  e2e-tests:
    name: E2E Tests
    # Playwright does not support ubuntu-latest (26.04) yet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lienzo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name lienzo -p 3000:3000 -e ORIGIN=http://localhost:3000 lienzo:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/ >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://localhost:3000/ | grep -q "Design it. Export it. Edit it again."
          curl -fsS http://localhost:3000/sitemap.xml | grep -q "<loc>"
          curl -fsS http://localhost:3000/canvas >/dev/null
      - name: Container logs
        if: failure()
        run: docker logs lienzo

  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, type-check, unit-tests, e2e-tests, build, docker]
    if: always()
    steps:
      - name: Check if all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "One or more checks failed"
              exit 1
            fi
          done
          echo "All checks passed!"
