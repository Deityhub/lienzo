<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="icon" href="/favicon/favicon.ico" sizes="any" />
		<link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
		<link rel="manifest" href="/favicon/site.webmanifest" />
		<meta name="theme-color" content="#0f6cbd" />
		<script>
			// Apply the saved or system theme before the first paint, so the page never flashes the wrong one
			(function () {
				try {
					var theme = localStorage.getItem('lienzo-theme');
					if (theme !== 'light' && theme !== 'dark') {
						theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					var root = document.documentElement;
					if (theme === 'dark') root.classList.add('dark');
					root.style.colorScheme = theme;
				} catch (e) {
					/* storage can be blocked: keep the default theme */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
